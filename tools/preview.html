<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Preview</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../css/content.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
  #bar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 14px; font-size: 14px; }
  #bar.bad { background: var(--bad-soft); }
  #bar.good { background: var(--good-soft); }
  #bar pre { white-space: pre-wrap; margin: 4px 0 0; font-size: 12px; max-height: 30vh; overflow: auto; }
  main { max-width: 860px; margin: 0 auto; padding: 12px 16px 80px; }
  section.g-sec { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 18px; }
  section.g-sec > .sec-id { font: 11px var(--mono); color: var(--muted); }
  textarea { width: 100%; min-height: 160px; font: 12px var(--mono); }
  article.q { border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin: 18px 0; background: var(--surface); }
  article.q .q-hint, article.q .q-solution, article.q .q-check, article.q .fb { display: block; border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 6px; }
  article.q .q-hint::before { content: "Hint"; font-weight: 700; color: var(--warn); display: block; }
  article.q .q-solution::before { content: "Solution"; font-weight: 700; color: var(--good); display: block; }
  article.q .q-check::before { content: "Sanity check"; font-weight: 700; color: var(--accent); display: block; }
  article.q .fb::before { content: "Feedback for answer ≈ " attr(data-match); font-weight: 700; color: var(--bad); display: block; }
  article.q .ans { background: var(--surface-2); padding: 4px 8px; border-radius: 6px; margin: 6px 0; font-family: var(--mono); font-size: 13px; }
  article.q .ans[data-type="num"]::before, article.q .ans:not([data-type])::before { content: "answer " attr(data-name) " = " attr(data-value) " " attr(data-unit) "  (tol " attr(data-tol) ")"; display: block; color: var(--good); }
  article.q .ans[data-type="mc"]::before { content: "multiple choice " attr(data-name) " — correct: " attr(data-correct); display: block; color: var(--good); }
  article.q .opt { border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; margin: 4px 0; font-family: "Segoe UI", system-ui, sans-serif; }
  article.q .opt::before { content: "(" attr(data-v) ") "; font-weight: 700; }
  article.q .opt-fb { display: block; color: var(--muted); font-size: 0.9em; }
</style>
</head>
<body>
<div id="bar">Loading…</div>
<main>
  <div id="content" class="guide"></div>
  <details style="margin-top:40px"><summary>Diagram playground (paste a JSON spec)</summary>
    <textarea id="play">{"parts":[{"t":"V","a":[0,3],"b":[0,0],"label":"V_s","value":"12 V"},{"t":"W","pts":[[0,0],[3,0]]},{"t":"R","a":[3,0],"b":[3,3],"label":"R_1","value":"4 kΩ"},{"t":"W","pts":[[0,3],[3,3]]}]}</textarea>
    <button id="go">Render</button>
    <div id="playout"></div>
  </details>
</main>
<script src="../vendor/katex/katex.min.js"></script>
<script src="../vendor/katex/contrib/auto-render.min.js"></script>
<script src="../js/diagrams.js"></script>
<script src="../js/render.js"></script>
<script>
(async function () {
  const qs = new URLSearchParams(location.search);
  const f = qs.get('f');
  const bar = document.getElementById('bar');
  const content = document.getElementById('content');
  document.getElementById('go').onclick = () => {
    try { const r = EEDiagrams.renderSpec(JSON.parse(document.getElementById('play').value)); document.getElementById('playout').innerHTML = r.svg; }
    catch (e) { document.getElementById('playout').textContent = e.message; }
  };
  if (!f) { bar.textContent = 'Add ?f=data/guides/<id>.html (or data/practice/<topic>.html) to preview a fragment.'; return; }
  let lessons = [];
  try { lessons = await (await fetch('../data/lessons.json', { cache: 'no-store' })).json(); } catch (e) {}
  const id = (f.match(/([^/]+)\.html$/) || [])[1];
  const lesson = lessons.find(l => l.id === id);
  const res = await fetch('../' + f, { cache: 'no-store' });
  if (!res.ok) { bar.textContent = 'Could not load ' + f + ' (' + res.status + ')'; bar.className = 'bad'; return; }
  const html = await res.text();
  content.innerHTML = html;
  const problems = [];
  // structural checks for guides
  if (f.includes('/guides/')) {
    const secs = [...content.querySelectorAll('section.g-sec')];
    const ids = new Set();
    secs.forEach(s => {
      if (!s.id) problems.push('section without id: ' + (s.querySelector('h2') || {}).textContent);
      else if (ids.has(s.id)) problems.push('duplicate section id ' + s.id); else ids.add(s.id);
      if (!s.querySelector(':scope > h2')) problems.push('section ' + s.id + ' has no direct <h2>');
      const tag = document.createElement('div'); tag.className = 'sec-id'; tag.textContent = '#' + s.id + (s.dataset.kind ? '  kind=' + s.dataset.kind : '') + (s.dataset.ts ? '  ts=' + s.dataset.ts : '');
      s.prepend(tag);
    });
    ['overview', 'objectives', 'prereqs', 'definitions', 'assumptions', 'mistakes', 'recap'].forEach(k => {
      if (!content.querySelector('section.g-sec[data-kind="' + k + '"]')) problems.push('missing required section data-kind="' + k + '"');
    });
    const outside = [...content.children].filter(c => !(c.matches('section.g-sec')));
    if (outside.length) problems.push(outside.length + ' top-level element(s) outside <section class="g-sec">');
  }
  if (f.includes('/practice/')) {
    const qs = [...content.querySelectorAll('article.q')];
    const core = qs.filter(q => /-q\d+$/.test(q.id || '')), bonus = qs.filter(q => /-b\d+$/.test(q.id || ''));
    if (core.length !== 4) problems.push('expected exactly 4 core questions (' + id + '-q1…q4), found ' + core.length);
    if (core.length + bonus.length !== qs.length) problems.push('some <article class="q"> ids are neither ' + id + '-qN nor ' + id + '-bN');
    qs.forEach((q, i) => {
      const nm = q.id || ('article #' + (i + 1));
      const isBonus = /-b\d+$/.test(q.id || '');
      if (!isBonus && !new RegExp('^' + id + '-q' + (i + 1) + '$').test(q.id || '')) problems.push(nm + ': id should be ' + id + '-q' + (i + 1) + ' (core questions come first, in order)');
      if (isBonus && !new RegExp('^' + id + '-b' + (i - 3) + '$').test(q.id)) problems.push(nm + ': bonus ids should follow the core questions as ' + id + '-b1, -b2…');
      ['data-level', 'data-kind', 'data-title'].forEach(a => { if (!q.getAttribute(a)) problems.push(nm + ': missing ' + a); });
      if (!q.querySelector(':scope > .q-prompt')) problems.push(nm + ': missing .q-prompt');
      const ans = q.querySelectorAll(':scope > .q-answers > .ans');
      if (!ans.length) problems.push(nm + ': no .ans in .q-answers');
      ans.forEach(a => {
        const t = a.dataset.type || 'num';
        if (t === 'num') { if (isNaN(parseFloat(a.dataset.value))) problems.push(nm + ': numeric answer ' + a.dataset.name + ' lacks data-value'); if (!a.dataset.name) problems.push(nm + ': answer lacks data-name'); }
        else if (t === 'mc') { if (!a.dataset.correct || !a.querySelector('.opt[data-v="' + a.dataset.correct + '"]')) problems.push(nm + ': mc answer lacks a valid data-correct'); a.querySelectorAll('.opt').forEach(o => { if (!o.querySelector('.opt-fb')) problems.push(nm + ': option ' + o.dataset.v + ' lacks .opt-fb explanation'); }); }
      });
      q.querySelectorAll(':scope > .fb').forEach(fb => { if (!q.querySelector('.ans[data-name="' + fb.dataset.for + '"]')) problems.push(nm + ': .fb data-for="' + fb.dataset.for + '" matches no answer'); if (isNaN(parseFloat(fb.dataset.match))) problems.push(nm + ': .fb without numeric data-match'); });
      const nh = q.querySelectorAll(':scope > .q-hint').length; if (nh < 2) problems.push(nm + ': needs ≥2 .q-hint (found ' + nh + ')');
      ['.q-solution', '.q-check', '.q-links'].forEach(s => { if (!q.querySelector(':scope > ' + s)) problems.push(nm + ': missing ' + s); });
      q.querySelectorAll('a.ts').forEach(a => { const L = lessons.find(x => x.id === a.dataset.lesson); if (!L) problems.push(nm + ': ts link without valid data-lesson'); else if (EERender.parseTime(a.dataset.t) > L.durationSec) problems.push(nm + ': ts beyond video length'); });
      q.querySelectorAll('a.xref').forEach(a => { if (!lessons.find(x => x.id === a.dataset.lesson)) problems.push(nm + ': xref without valid data-lesson'); });
    });
    // verify xref targets exist in guides
    const refs = [...content.querySelectorAll('a.xref[data-sec]')];
    const byLesson = {};
    refs.forEach(a => { (byLesson[a.dataset.lesson] = byLesson[a.dataset.lesson] || []).push(a.dataset.sec); });
    for (const [lid, secs] of Object.entries(byLesson)) {
      try { const g = await (await fetch('../data/guides/' + lid + '.html', { cache: 'no-store' })).text(); secs.forEach(s => { if (!g.includes('id="' + s + '"')) problems.push('xref to missing guide id ' + lid + '#' + s); }); }
      catch (e) { problems.push('could not load guide ' + lid); }
    }
  }
  const errs = EERender.renderContent(content, { lessonId: f.includes('/practice/') ? null : id, duration: lesson && lesson.durationSec });
  problems.push(...errs);
  const nTs = content.querySelectorAll('a.ts').length, nFig = content.querySelectorAll('figure').length, nMath = content.querySelectorAll('.katex').length;
  const nSec = content.querySelectorAll('section.g-sec').length;
  const summary = `${f}: ${nSec} sections, ${nFig} figures, ${nMath} math items, ${nTs} timestamp links` + (lesson ? ` — video length ${EERender.fmtTime(lesson.durationSec)}` : '');
  bar.className = problems.length ? 'bad' : 'good';
  bar.innerHTML = '<b>' + (problems.length ? problems.length + ' problem(s)' : 'No problems found') + '</b> — ' + summary + (problems.length ? '<pre>' + problems.map(p => '• ' + p).join('\n').replace(/</g, '&lt;') + '</pre>' : '');
  window.__previewResult = { problems, nSec, nFig, nMath, nTs };
  content.addEventListener('click', e => { const a = e.target.closest('a.ts'); if (a) { e.preventDefault(); if (lesson) window.open('https://www.youtube.com/watch?v=' + lesson.ytId + '&t=' + Math.floor(a.dataset.t) + 's', '_blank'); } });
})();
</script>
</body>
</html>
